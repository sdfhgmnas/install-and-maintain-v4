name: Keep Supabase Alive
 
# Runs every 3 days at 06:00 UTC (11:30 AM IST)
# This prevents Supabase free-tier project from auto-pausing after 7 days
# of inactivity by making a lightweight API call.
 
on:
  schedule:
    - cron: '0 6 */3 * *'  # Every 3 days
  workflow_dispatch:  # Also allow manual trigger from Actions tab
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent auto-pause..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/installations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "HTTP Response Code: $RESPONSE"
          
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 206 ]; then
            echo "✅ Supabase is alive! (HTTP $RESPONSE)"
            exit 0
          else
            echo "❌ Unexpected response: HTTP $RESPONSE"
            exit 1
          fi
 
      - name: Report timestamp
        if: always()
        run: |
          echo "Ping completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Next ping in 3 days"
 











